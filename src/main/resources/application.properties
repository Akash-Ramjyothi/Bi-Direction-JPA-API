# ------------------------------------------------------
# Application
# ------------------------------------------------------
spring.application.name=mappings
spring.main.banner-mode=off

# ------------------------------------------------------
# Server Configuration
# ------------------------------------------------------
server.port=8080
server.servlet.context-path=/

# ------------------------------------------------------
# Database (MySQL)
# ------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/hb-05-many-to-many
spring.datasource.username=springstudent
spring.datasource.password=springstudent
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------
# Connection Pool (HikariCP - Default in Spring Boot)
# ------------------------------------------------------
spring.datasource.hikari.pool-name=HikariPool-Mappings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ------------------------------------------------------
# Logging
# ------------------------------------------------------
logging.level.root=warn
logging.level.org.springframework=info
logging.level.org.hibernate.SQL=trace
logging.level.org.hibernate.orm.jdbc.bind=trace
logging.level.com.jpa.mappings=debug

# ------------------------------------------------------
# Actuator (Optional Monitoring)
# ------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
